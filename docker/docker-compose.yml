version: '3.8'

services:
  # PostgreSQL para ALEsys Core (vectores + grafos)
  postgres-core:
    image: pgvector/pgvector:pg16
    container_name: alesys-postgres-core
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alesys}
      POSTGRES_USER: ${POSTGRES_USER:-alesys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - alesys-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alesys}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL para usuarios y sesiones (WebUI multi-usuario)
  postgres-users:
    image: postgres:16
    container_name: alesys-postgres-users
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${USERS_POSTGRES_DB:-alesys_users}
      POSTGRES_USER: ${USERS_POSTGRES_USER:-alesys}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - alesys-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_POSTGRES_USER:-alesys}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ALEsys Core API (Rust)
  alesys-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: alesys-core
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alesys}:${POSTGRES_PASSWORD}@postgres-core:5432/${POSTGRES_DB:-alesys}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3000:3000"
    volumes:
      - ../books:/books:ro
      - ../sandbox:/sandbox
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - alesys-network

  # PHP Server (WebUI backend)
  php-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    container_name: alesys-php
    env_file:
      - .env
    environment:
      ALESYS_CORE_URL: http://alesys-core:3000
      DB_HOST: postgres-users
      DB_NAME: ${USERS_POSTGRES_DB:-alesys_users}
      DB_USER: ${USERS_POSTGRES_USER:-alesys}
      DB_PASSWORD: ${USERS_POSTGRES_PASSWORD}
      ALESYS_SERVICE_TOKEN: ${ALESYS_SERVICE_TOKEN}
    ports:
      - "8080:9000"
    volumes:
      - .:/var/www/html
      - ../webui/dist:/var/www/html/assets:ro
    depends_on:
      postgres-users:
        condition: service_healthy
      alesys-core:
        condition: service_started
    networks:
      - alesys-network

  # Nginx (solo para producción)
  nginx:
    image: nginx:alpine
    profiles:
      - production
    container_name: alesys-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html:ro
      - ../webui/dist:/var/www/html/assets:ro
    depends_on:
      - php-server
    networks:
      - alesys-network

  # MLflow Tracking Server (Experiment Tracking)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: alesys-mlflow
    env_file:
      - .env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-alesys}:${POSTGRES_PASSWORD}@postgres-core:5432/${POSTGRES_DB:-alesys}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-alesys}:${POSTGRES_PASSWORD}@postgres-core:5432/${POSTGRES_DB:-alesys}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - alesys-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Yjs WebSocket Server (collaborative editing)
  yjs-server:
    build:
      context: ./yjs-server
      dockerfile: Dockerfile
    container_name: alesys-yjs
    ports:
      - "1234:1234"
    environment:
      PORT: 1234
    networks:
      - alesys-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # lakeFS (data versioning for experiments)
  lakefs:
    image: treeverse/lakefs:latest
    container_name: alesys-lakefs
    ports:
      - "8000:8000"
    environment:
      LAKEFS_DATABASE_TYPE: "local"
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: "alesys-dev-secret-change-me"
      LAKEFS_BLOCKSTORE_TYPE: "local"
      LAKEFS_BLOCKSTORE_LOCAL_PATH: "/data"
      LAKEFS_LOGGING_LEVEL: "INFO"
    volumes:
      - lakefs_data:/data
    networks:
      - alesys-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'


volumes:
  postgres_core_data:
  postgres_users_data:
  mlflow_artifacts:
  lakefs_data:

networks:
  alesys-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16