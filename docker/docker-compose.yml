version: '3.8'

services:
  # PostgreSQL para ALEsys Core (vectores + grafos)
  postgres-core:
    image: pgvector/pgvector:pg16
    container_name: alesys-postgres-core
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alesys}
      POSTGRES_USER: ${POSTGRES_USER:-alesys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - alesys-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alesys}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL para usuarios y sesiones (WebUI multi-usuario)
  postgres-users:
    image: postgres:16
    container_name: alesys-postgres-users
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${USERS_POSTGRES_DB:-alesys_users}
      POSTGRES_USER: ${USERS_POSTGRES_USER:-alesys}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - alesys-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_POSTGRES_USER:-alesys}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ALEsys Core API (Rust)
  alesys-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: alesys-core
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alesys}:${POSTGRES_PASSWORD}@postgres-core:5432/${POSTGRES_DB:-alesys}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3000:3000"
    volumes:
      - ../books:/books:ro
      - ../sandbox:/sandbox
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - alesys-network

  # PHP Server (WebUI backend)
  php-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    container_name: alesys-php
    env_file:
      - .env
    environment:
      ALESYS_CORE_URL: http://alesys-core:3000
      DB_HOST: postgres-users
      DB_NAME: ${USERS_POSTGRES_DB:-alesys_users}
      DB_USER: ${USERS_POSTGRES_USER:-alesys}
      DB_PASSWORD: ${USERS_POSTGRES_PASSWORD}
      ALESYS_SERVICE_TOKEN: ${ALESYS_SERVICE_TOKEN}
    ports:
      - "8080:9000"
    volumes:
      - .:/var/www/html
      - ../webui/dist:/var/www/html/assets:ro
    depends_on:
      postgres-users:
        condition: service_healthy
      alesys-core:
        condition: service_started
    networks:
      - alesys-network

  # Nginx (solo para producción)
  nginx:
    image: nginx:alpine
    profiles:
      - production
    container_name: alesys-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html:ro
      - ../webui/dist:/var/www/html/assets:ro
    depends_on:
      - php-server
    networks:
      - alesys-network

volumes:
  postgres_core_data:
  postgres_users_data:

networks:
  alesys-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16