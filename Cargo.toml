[workspace]
members = [
    "crates/core",
    "crates/api",
    "crates/cli",
]
exclude = [
    "desktop/src-tauri",  # Se builda separado
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jesus <tu@email.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/tu-usuario/ALEsys"
description = "GraphRAG-PG: PostgreSQL Graph & Vector Ingestion Engine"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# LLM / ML
mistralrs = "0.8"
llama_cpp = { version = "0.3", features = ["vulkan"] }
candle-core = "0.11"
candle-transformers = "0.11"
candle-nn = "0.11"
tokenizers = "0.21"
hf-hub = { version = "0.4", features = ["ureq"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1.20"
toml = "0.8"

# Phase 4: Performance
async-trait = "0.1"
moka = { version = "0.12", features = ["future", "sync"] }
tokio-stream = "0.1"
futures = "0.3"
metrics = "0.22"
metrics-exporter-prometheus = "0.15"

