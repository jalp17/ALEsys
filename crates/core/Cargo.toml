[package]
name = "alesys-core"
version.workspace = true
edition.workspace = true
description = "ALEsys core logic: LLM, GraphRAG, session management"

[dependencies]
# Workspace
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
pgvector.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
once_cell.workspace = true
async-trait.workspace = true
futures.workspace = true

# Graph data structures
petgraph = "0.8"

# LLM inference
mistralrs = { workspace = true, optional = true }
llama_cpp = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
num_cpus = "1"

# TOML parsing para model registry
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["llama-cpp"]
test = []
llama-cpp = ["dep:llama_cpp"]
mistralrs-backend = ["dep:mistralrs"]
candle-backend = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
vllm-backend = ["dep:reqwest"]
transformers-backend = ["dep:reqwest"]
