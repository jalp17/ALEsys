name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================
  # Lint & Format (Fast Feedback)
  # ===========================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Vulkan dependencies (for llama.cpp Vulkan backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build Rust (required for clippy)
        run: cargo build --workspace

      - name: Run Clippy (Rust linter)
        run: cargo clippy --workspace -- -D warnings

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webui dependencies
        run: pnpm install
        working-directory: webui

      - name: Check TypeScript
        run: pnpm tsc --noEmit
        working-directory: webui

  # ===========================================
  # Rust Tests
  # ===========================================
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Vulkan dependencies (for llama.cpp Vulkan backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust unit tests
        run: cargo test --workspace --lib

      - name: Run Rust integration tests
        run: cargo test --workspace --test '*'
        continue-on-error: true

  # ===========================================
  # WebUI Tests
  # ===========================================
  webui-tests:
    name: WebUI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install
        working-directory: webui

      - name: Run WebUI tests
        run: pnpm test || echo "No test files found - skipping"
        working-directory: webui
        continue-on-error: true

      - name: Build WebUI
        run: pnpm build:web
        working-directory: webui

  # ===========================================
  # Security Scanning
  # ===========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gitleaks (secrets scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/rust
        continue-on-error: true

  # ===========================================
  # Build Docker Images
  # ===========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    
    needs: [rust-tests, webui-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build Rust Core image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.core
          push: false
          tags: alesys/core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build PHP image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/docker/Dockerfile.php
          push: false
          tags: alesys/php:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Integration Tests (on phase/* and main)
  # ===========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/phase/')
    
    needs: [rust-tests, webui-tests, docker-build]
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alesys
          POSTGRES_PASSWORD: alesys
          POSTGRES_DB: alesys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alesys -d alesys_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Vulkan dependencies (for llama.cpp Vulkan backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Initialize database
        run: |
          PGPASSWORD=alesys psql -h localhost -U alesys -d alesys_test -f docker/init-db.sql

      - name: Run integration tests
        run: cargo test --workspace --test '*'
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: alesys
          PGPASSWORD: alesys
          PGDATABASE: alesys_test

  # ===========================================
  # Deploy (only on main)
  # ===========================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    continue-on-error: true
    
    needs: [lint, rust-tests, webui-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.core
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            alesys/core:latest
            alesys/core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Add your deployment steps here
          # Example: docker compose -f docker/docker-compose.prod.yml up -d

  # ===========================================
  # Dependency Review (PR only)
  # ===========================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: 'high'

  # ===========================================
  # Notify
  # ===========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, rust-tests, webui-tests, security, docker-build]
    if: always()
    
    steps:
      - name: Notify on failure
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ CI/CD Pipeline failed!"
          # Add your notification steps here (Slack, Discord, Email, etc.)

      - name: Notify on success
        if: contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure')
        run: |
          echo "✅ CI/CD Pipeline succeeded!"
          # Add your notification steps here