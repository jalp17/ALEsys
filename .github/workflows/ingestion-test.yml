name: Ingestion Tests

on:
  push:
    paths:
      - 'crates/core/src/ingestion/**'
      - 'tests/e2e/ingestion_test.py'
      - '.github/workflows/ingestion-test.yml'
  pull_request:
    paths:
      - 'crates/core/src/ingestion/**'
      - 'tests/e2e/ingestion_test.py'
      - '.github/workflows/ingestion-test.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p alesys-core --lib -- --test-threads=4

  e2e-tests:
    runs-on: self-hosted
    labels:
      - gpu
      - alesys
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p alesys-core --lib -- --test-threads=4
      - run: python3 tests/e2e/ingestion_test.py
        env:
          DATABASE_URL: postgres://alesys:alesys@localhost:5432/alesys
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RUST_LOG: info
