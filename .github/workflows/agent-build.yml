name: Agent Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build from'
        required: false

env:
  CARGO_TERM_COLOR: always
  AGENT_NAME: alesys-agent

jobs:
  # ===========================================
  # Build Agent Binaries (Matrix)
  # ===========================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: alesys-agent-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: alesys-agent-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: alesys-agent-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: alesys-agent-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: alesys-agent-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-agent-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-agent-${{ matrix.target }}-

      - name: Build agent binary
        run: cargo build --release -p alesys-agent --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.AGENT_NAME }} ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ env.AGENT_NAME }}.exe" "${{ matrix.artifact }}.exe"

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.exe
          retention-days: 7

  # ===========================================
  # Create Release with all binaries
  # ===========================================
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" >> ../checksums.sha256
            done
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
          body: |
            ## ALEsys Agent ${{ github.ref_name }}

            ### Instalación rápida
            ```bash
            curl -fsSL https://raw.githubusercontent.com/jalp17/ALEsys/master/scripts/install-agent.sh | bash
            ```

            ### Binarios disponibles
            | Plataforma | Archivo |
            |---|---|
            | Linux x86_64 | `alesys-agent-linux-amd64` |
            | Linux ARM64 | `alesys-agent-linux-arm64` |
            | macOS Intel | `alesys-agent-macos-amd64` |
            | macOS Apple Silicon | `alesys-agent-macos-arm64` |
            | Windows x86_64 | `alesys-agent-windows-amd64.exe` |

            ### Uso
            ```bash
            ./alesys-agent --server ws://your-server:3000/ws/agent --token YOUR_TOKEN
            ```
