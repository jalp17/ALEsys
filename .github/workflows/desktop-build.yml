name: Desktop Build

on:
  push:
    branches: [master, 'phase/**']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        format: [deb, AppImage, rpm]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libdrm-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: |
          corepack enable pnpm
          cd webui
          pnpm install --frozen-lockfile

      - name: Build webui for desktop
        run: |
          cd webui
          pnpm run build:desktop

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo build --release

      - name: Package as ${{ matrix.format }}
        uses: tauri-apps/tauri-action@v2
        with:
          projectPath: desktop/src-tauri
          bundleIdentifier: com.alesys.desktop
          args: --bundles ${{ matrix.format }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: |
          corepack enable pnpm
          cd webui
          pnpm install --frozen-lockfile

      - name: Build webui for desktop
        run: |
          cd webui
          pnpm run build:desktop

      - name: Build Tauri app (no signing for development)
        run: |
          cd desktop/src-tauri
          cargo tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: |
          corepack enable pnpm
          cd webui
          pnpm install --frozen-lockfile

      - name: Build webui for desktop
        run: |
          cd webui
          pnpm run build:desktop

      - name: Build and package Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --bundles msi